<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Clics del chatbot</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--or:#F25C05;--bg:#FAF8F6;--card:#fff;--tx:#1F2937;--mu:#6B7280;--bd:#E5E1DC}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:24px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:22px;margin:0}
button,input,select{font:inherit}
.btn{background:var(--or);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
#login{max-width:360px;margin:80px auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:24px}
#login input{width:100%;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;margin:10px 0}
#err{color:#B91C1C;min-height:20px;font-size:13px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:6px 14px;cursor:pointer;display:flex;gap:6px;align-items:center}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip.on{border-color:var(--or);background:#FFF1E8;font-weight:600}
.chip small{color:var(--mu)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.kpi,.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.kpi b{display:block;font-size:28px}
.kpi span{color:var(--mu);font-size:13px}
.charts{display:grid;grid-template-columns:1fr 2fr;gap:12px;margin-bottom:12px}
@media(max-width:720px){.charts{grid-template-columns:1fr}}
.panel{margin-bottom:12px}
.charts .panel{margin-bottom:0}
.panel h2{font-size:15px;margin:0}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.ph select,.tools input{padding:6px 10px;border:1px solid var(--bd);border-radius:8px;background:#fff}
.cv{position:relative;height:260px}
.note{color:var(--mu);font-size:12px;margin:8px 0 0}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}
th{cursor:pointer;color:var(--mu);font-weight:600}
td.t{max-width:320px;overflow:hidden;text-overflow:ellipsis}
.tag{padding:2px 9px;border-radius:999px;color:#fff;font-size:12px}
.empty{color:var(--mu);padding:20px;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<section id="login">
  <h1>Clics del chatbot</h1>
  <form id="f"><input id="key" type="password" placeholder="Clave de administrador" autocomplete="current-password" required>
  <div id="err"></div><button class="btn">Ver estadísticas</button></form>
</section>

<main id="app" hidden>
  <header>
    <h1>Clics del chatbot</h1>
    <div>
      <button class="btn sec" id="reload">Actualizar</button>
      <button class="btn sec" id="out">Salir</button>
    </div>
  </header>

  <div class="filters" id="filters"></div>
  <div class="kpis" id="kpis"></div>

  <div class="panel">
    <div class="ph"><h2>Clics por día</h2>
      <select id="range"><option value="7">Últimos 7 días</option><option value="30" selected>Últimos 30 días</option><option value="90">Últimos 90 días</option><option value="0">Todo el historial</option></select>
    </div>
    <div class="cv"><canvas id="c3"></canvas></div>
    <p class="note" id="legacy" hidden></p>
  </div>

  <div class="charts">
    <div class="panel"><div class="ph"><h2>Clics por tipo</h2></div><div class="cv"><canvas id="c1"></canvas></div></div>
    <div class="panel"><div class="ph"><h2>Destinos más clicados</h2></div><div class="cv"><canvas id="c2"></canvas></div></div>
  </div>

  <div class="panel" style="margin-top:12px">
    <div class="ph tools"><h2>Detalle</h2><input id="q" placeholder="Buscar destino…"></div>
    <div class="wrap"><table>
      <thead><tr><th data-k="type">Tipo</th><th data-k="target">Destino</th><th data-k="clicks">Clics</th></tr></thead>
      <tbody id="rows"></tbody></table></div>
  </div>
</main>

<script>
const ENDPOINT = 'contador.php';   
const LABEL = {mail:'Correo', whatsapp:'WhatsApp', phone:'Teléfono', web:'Web'};
const COLOR = {mail:'#2563EB', whatsapp:'#16A34A', phone:'#C2410C', web:'#7C3AED'};
let KEY = sessionStorage.getItem('eg_key') || '', DATA = [], filter = 'all', sort = {k:'clicks', d:-1}, charts = {};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

// La clave viaja en un header, no en la URL
const api = action => fetch(`${ENDPOINT}?action=${action}`, {headers:{'X-Admin-Key': KEY}, cache:'no-store'});

async function load(){
  const r = await api('json');
  if (r.status === 403) throw new Error('Clave incorrecta');
  if (!r.ok) throw new Error('No se pudo cargar (' + r.status + ')');
  DATA = Object.values(await r.json());
  $('login').hidden = true; $('app').hidden = false;
  render();
}

function dayList(){
  const today = new Date(), base = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  let n = +$('range').value;
  if (!n){
    const all = DATA.flatMap(d => Object.keys(d.days || {})).sort();
    n = all.length ? Math.min(366, Math.round((base - new Date(all[0] + 'T00:00:00')) / 864e5) + 1) : 7;
  }
  return Array.from({length:n}, (_, i) => fmt(new Date(base.getFullYear(), base.getMonth(), base.getDate() - (n - 1 - i))));
}

function render(){
  const total = DATA.reduce((s,d)=>s+d.clicks,0);
  const byType = {}; DATA.forEach(d => byType[d.type] = (byType[d.type]||0) + d.clicks);

  $('filters').innerHTML = [['all','Todos',total], ...Object.keys(LABEL).map(t=>[t,LABEL[t],byType[t]||0])]
    .map(([t,l,n]) => `<button class="chip ${filter===t?'on':''}" data-t="${t}">${t!=='all'?`<i style="background:${COLOR[t]}"></i>`:''}${l} <small>${n}</small></button>`).join('');

  const rows = DATA.filter(d => filter==='all' || d.type===filter);
  const sum = rows.reduce((s,d)=>s+d.clicks,0);
  const top = [...rows].sort((a,b)=>b.clicks-a.clicks)[0];
  const todayKey = fmt(new Date());
  const hoy = rows.reduce((s,d)=>s+((d.days||{})[todayKey]||0),0);
  $('kpis').innerHTML =
    `<div class="kpi"><b>${sum}</b><span>Clics totales</span></div>
     <div class="kpi"><b>${hoy}</b><span>Clics hoy</span></div>
     <div class="kpi"><b>${rows.length}</b><span>Enlaces distintos</span></div>
     <div class="kpi"><b style="font-size:16px;overflow:hidden;text-overflow:ellipsis;display:block">${top ? esc(top.target) : '—'}</b><span>Más clicado${top ? ' ('+top.clicks+')' : ''}</span></div>`;

  // Clics por día (apilado por tipo; con filtro, solo ese tipo)
  const days = dayList(), vis = filter==='all' ? Object.keys(LABEL) : [filter];
  drawChart('c3', 'bar', {
    labels: days.map(d => d.slice(5)),
    datasets: vis.map(t => ({label:LABEL[t], backgroundColor:COLOR[t],
      data: days.map(day => rows.filter(r => r.type===t).reduce((s,r)=>s+((r.days||{})[day]||0),0))}))
  }, {scales:{x:{stacked:true, ticks:{maxRotation:0, autoSkip:true}}, y:{stacked:true, beginAtZero:true, ticks:{precision:0}}},
      plugins:{legend:{position:'bottom'}}});

  const withDays = rows.reduce((s,d)=>s+Object.values(d.days||{}).reduce((a,b)=>a+b,0),0);
  $('legacy').hidden = sum === withDays;
  $('legacy').textContent = `${sum - withDays} clics son anteriores al registro diario y no aparecen en este gráfico.`;

  const types = Object.keys(byType);
  drawChart('c1', 'doughnut', {labels:types.map(t=>LABEL[t]), datasets:[{data:types.map(t=>byType[t]), backgroundColor:types.map(t=>COLOR[t])}]},
    {plugins:{legend:{position:'bottom'}}});

  const t8 = [...rows].sort((a,b)=>b.clicks-a.clicks).slice(0,8);
  drawChart('c2', 'bar', {labels:t8.map(d=>d.target.length>28 ? d.target.slice(0,27)+'…' : d.target), datasets:[{data:t8.map(d=>d.clicks), backgroundColor:t8.map(d=>COLOR[d.type])}]},
    {indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true, ticks:{precision:0}}}});

  renderTable(rows);
}

function renderTable(rows){
  const q = $('q').value.trim().toLowerCase();
  rows = rows.filter(d => !q || d.target.toLowerCase().includes(q))
             .sort((a,b) => (a[sort.k] > b[sort.k] ? 1 : a[sort.k] < b[sort.k] ? -1 : 0) * sort.d);
  $('rows').innerHTML = rows.length ? rows.map(d =>
    `<tr><td><span class="tag" style="background:${COLOR[d.type]}">${LABEL[d.type]||esc(d.type)}</span></td>
     <td class="t" title="${esc(d.target)}">${esc(d.target)}</td><td><b>${d.clicks}</b></td></tr>`).join('')
    : `<tr><td colspan="3" class="empty">Sin clics registrados para este filtro.</td></tr>`;
}

function drawChart(id, type, data, options){
  if (charts[id]) charts[id].destroy();
  charts[id] = new Chart($(id), {type, data, options:{responsive:true, maintainAspectRatio:false, ...options}});
}

$('filters').onclick = e => { const b = e.target.closest('.chip'); if (b){ filter = b.dataset.t; render(); } };
$('q').oninput = () => render();
$('range').onchange = () => render();
document.querySelector('thead').onclick = e => {
  const k = e.target.dataset.k; if (!k) return;
  sort = {k, d: sort.k===k ? -sort.d : -1}; render();
};
$('reload').onclick = () => load().catch(e => alert(e.message));
$('out').onclick = () => { sessionStorage.removeItem('eg_key'); location.reload(); };
$('f').onsubmit = async e => {
  e.preventDefault(); KEY = $('key').value;
  try { await load(); sessionStorage.setItem('eg_key', KEY); $('err').textContent=''; }
  catch(err){ $('err').textContent = err.message; }
};
if (KEY) load().catch(()=>{ sessionStorage.removeItem('eg_key'); });
</script>
</body>
</html>
